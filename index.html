<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuiz Matematik Interaktif (5-6 Tahun)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: 'Fredoka', cursive, sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 50%, #fef3c7 100%);
            min-height: 100vh;
        }
        
        .btn-option {
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            touch-action: manipulation;
        }

        .btn-option:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .btn-option:active:not(:disabled) {
            transform: translateY(1px) scale(0.98);
        }

        .shake {
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        .pop {
            animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes pop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="p-3 sm:p-6 md:p-10 text-gray-800 pb-20">

    <div class="max-w-3xl mx-auto bg-white/90 backdrop-blur-md p-5 sm:p-8 rounded-3xl shadow-xl border-4 border-green-300">
        
        <!-- Header & Dashboard -->
        <div class="text-center mb-8">
            <span class="inline-block bg-yellow-300 text-yellow-900 font-bold px-4 py-1 rounded-full text-sm mb-2 shadow-sm">
                ⭐ Umur 5-6 Tahun ⭐
            </span>
            <h1 class="text-3xl sm:text-4xl font-extrabold text-green-600 drop-shadow-sm flex items-center justify-center gap-2">
                <span>Jom Kira!</span> <span>➕</span> <span>➖</span>
            </h1>
            <p class="text-gray-600 text-sm sm:text-base mt-1">Tekan pada jawapan yang betul di bawah!</p>

            <!-- Score & Progress Bar -->
            <div class="mt-6 bg-green-50 p-4 rounded-2xl border-2 border-green-200 flex flex-wrap items-center justify-between gap-4">
                <div class="text-left">
                    <p class="text-xs text-gray-500 font-semibold uppercase tracking-wider">Kemajuan</p>
                    <p class="text-lg font-bold text-green-700"><span id="answered-count">0</span> / 20 Soalan Dijawab</p>
                </div>
                <div class="text-left sm:text-right">
                    <p class="text-xs text-gray-500 font-semibold uppercase tracking-wider">Markah Anda</p>
                    <p class="text-2xl font-black text-amber-500"><span id="score-count">0</span> ⭐</p>
                </div>
                <div class="w-full bg-gray-200 h-3 rounded-full overflow-hidden">
                    <div id="progress-bar" class="bg-gradient-to-r from-green-400 to-emerald-500 h-full w-0 transition-all duration-300"></div>
                </div>
            </div>
        </div>

        <!-- Questions Container -->
        <div id="questions-container" class="space-y-6">
            <!-- Questions dynamically generated by JavaScript -->
        </div>

        <!-- Bottom Action Bar & Answer Key -->
        <div class="mt-12 pt-8 border-t-4 border-dashed border-green-200">
            <div class="flex flex-col sm:flex-row items-center justify-between gap-4 mb-8">
                <button onclick="resetQuiz()" class="w-full sm:w-auto px-6 py-3 bg-amber-400 hover:bg-amber-500 text-amber-950 font-bold rounded-2xl shadow-md transition transform active:scale-95 flex items-center justify-center gap-2">
                    🔄 Main Semula
                </button>
                <button onclick="checkAllAnswers()" class="w-full sm:w-auto px-6 py-3 bg-green-500 hover:bg-green-600 text-white font-bold rounded-2xl shadow-md transition transform active:scale-95 flex items-center justify-center gap-2">
                    ✅ Semak Keputusan
                </button>
            </div>

            <!-- Answer Key Card -->
            <div class="bg-gradient-to-br from-green-50 to-emerald-50 p-6 rounded-3xl border-2 border-green-200 shadow-sm">
                <h2 class="text-xl font-bold text-green-800 mb-4 text-center flex items-center justify-center gap-2">
                    <span>📜</span> Skema Jawapan
                </h2>
                <div id="answer-key-grid" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-5 gap-3 text-center font-bold text-green-900">
                    <!-- Dynamic Answer Key -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // Audio Synth using Web Audio API for interactive clicks
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioCtx();
            }
        }

        function playSound(type) {
            try {
                initAudio();
                if (!audioCtx) return;

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'click') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === 'correct') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, now); // C5
                    osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
                    osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
                    osc.start(now);
                    osc.stop(now + 0.35);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.setValueAtTime(180, now + 0.15);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                }
            } catch(e) {
                console.log('Audio disabled or not allowed');
            }
        }

        // Quiz Questions Data (Matching exact requirements)
        const quizData = [
            { id: 1, question: "2 + 3 = ?", options: [{label:"A", val:"4"}, {label:"B", val:"5"}, {label:"C", val:"6"}, {label:"D", val:"3"}], correct: "B" },
            { id: 2, question: "5 - 1 = ?", options: [{label:"A", val:"4"}, {label:"B", val:"3"}, {label:"C", val:"2"}, {label:"D", val:"6"}], correct: "A" },
            { id: 3, question: "7 + 2 = ?", options: [{label:"A", val:"10"}, {label:"B", val:"8"}, {label:"C", val:"9"}, {label:"D", val:"7"}], correct: "C" },
            { id: 4, question: "9 - 4 = ?", options: [{label:"A", val:"5"}, {label:"B", val:"6"}, {label:"C", val:"4"}, {label:"D", val:"3"}], correct: "A" },
            { id: 5, question: "1 + 6 = ?", options: [{label:"A", val:"5"}, {label:"B", val:"8"}, {label:"C", val:"6"}, {label:"D", val:"7"}], correct: "D" },
            { id: 6, question: "8 - 3 = ?", options: [{label:"A", val:"4"}, {label:"B", val:"5"}, {label:"C", val:"2"}, {label:"D", val:"1"}], correct: "B" },
            { id: 7, question: "4 + 4 = ?", options: [{label:"A", val:"8"}, {label:"B", val:"9"}, {label:"C", val:"7"}, {label:"D", val:"10"}], correct: "A" },
            { id: 8, question: "10 - 2 = ?", options: [{label:"A", val:"7"}, {label:"B", val:"9"}, {label:"C", val:"8"}, {label:"D", val:"6"}], correct: "C" },
            { id: 9, question: "0 + 5 = ?", options: [{label:"A", val:"5"}, {label:"B", val:"0"}, {label:"C", val:"6"}, {label:"D", val:"4"}], correct: "A" },
            { id: 10, question: "6 - 6 = ?", options: [{label:"A", val:"1"}, {label:"B", val:"0"}, {label:"C", val:"2"}, {label:"D", val:"10"}], correct: "B" },
            { id: 11, question: "3 + 4 = ?", options: [{label:"A", val:"6"}, {label:"B", val:"8"}, {label:"C", val:"5"}, {label:"D", val:"7"}], correct: "D" },
            { id: 12, question: "7 - 5 = ?", options: [{label:"A", val:"2"}, {label:"B", val:"3"}, {label:"C", val:"1"}, {label:"D", val:"4"}], correct: "A" },
            { id: 13, question: "2 + 8 = ?", options: [{label:"A", val:"9"}, {label:"B", val:"10"}, {label:"C", val:"7"}, {label:"D", val:"6"}], correct: "B" },
            { id: 14, question: "5 - 5 = ?", options: [{label:"A", val:"1"}, {label:"B", val:"10"}, {label:"C", val:"0"}, {label:"D", val:"5"}], correct: "C" },
            { id: 15, question: "10 + 0 = ?", options: [{label:"A", val:"10"}, {label:"B", val:"0"}, {label:"C", val:"1"}, {label:"D", val:"9"}], correct: "A" },
            { id: 16, question: "8 - 7 = ?", options: [{label:"A", val:"0"}, {label:"B", val:"2"}, {label:"C", val:"1"}, {label:"D", val:"3"}], correct: "C" },
            { id: 17, question: "6 + 2 = ?", options: [{label:"A", val:"7"}, {label:"B", val:"8"}, {label:"C", val:"9"}, {label:"D", val:"5"}], correct: "B" },
            { id: 18, question: "4 - 0 = ?", options: [{label:"A", val:"4"}, {label:"B", val:"0"}, {label:"C", val:"3"}, {label:"D", val:"5"}], correct: "A" },
            { id: 19, question: "1 + 9 = ?", options: [{label:"A", val:"8"}, {label:"B", val:"9"}, {label:"C", val:"10"}, {label:"D", val:"7"}], correct: "C" },
            { id: 20, question: "3 - 1 = ?", options: [{label:"A", val:"1"}, {label:"B", val:"3"}, {label:"C", val:"4"}, {label:"D", val:"2"}], correct: "D" }
        ];

        // State object to track answers
        const userAnswers = {};

        function renderQuiz() {
            const container = document.getElementById('questions-container');
            container.innerHTML = '';

            quizData.forEach((item, index) => {
                const card = document.createElement('div');
                card.id = `q-card-${item.id}`;
                card.className = "bg-white p-5 rounded-2xl border-2 border-sky-100 shadow-sm hover:border-sky-300 transition-all pop";
                
                const selectedOption = userAnswers[item.id];

                let optionsHTML = '';
                item.options.forEach(opt => {
                    const isSelected = selectedOption === opt.label;
                    const isCorrect = selectedOption && opt.label === item.correct;
                    const isWrong = selectedOption && isSelected && opt.label !== item.correct;

                    let btnStyle = "bg-slate-50 border-2 border-slate-200 text-gray-700 hover:bg-sky-50 hover:border-sky-300";
                    
                    if (selectedOption) {
                        if (opt.label === item.correct) {
                            btnStyle = "bg-green-500 border-2 border-green-600 text-white font-bold scale-105 shadow-md";
                        } else if (isSelected) {
                            btnStyle = "bg-red-400 border-2 border-red-500 text-white font-bold opacity-80";
                        } else {
                            btnStyle = "bg-gray-100 border-2 border-gray-200 text-gray-400 opacity-50";
                        }
                    }

                    optionsHTML += `
                        <button 
                            type="button"
                            onclick="selectAnswer(${item.id}, '${opt.label}')"
                            class="btn-option flex items-center justify-between p-3.5 rounded-xl ${btnStyle} font-semibold text-lg w-full cursor-pointer focus:outline-none"
                        >
                            <span class="flex items-center gap-2">
                                <span class="w-8 h-8 rounded-lg ${isSelected ? 'bg-white/20' : 'bg-gray-200/60'} flex items-center justify-center text-sm font-bold">
                                    ${opt.label}
                                </span>
                                <span>${opt.val}</span>
                            </span>
                            ${selectedOption ? (opt.label === item.correct ? '<span>✨</span>' : (isSelected ? '<span>❌</span>' : '')) : ''}
                        </button>
                    `;
                });

                card.innerHTML = `
                    <div class="flex items-center justify-between mb-3">
                        <span class="text-sm font-extrabold text-sky-600 bg-sky-50 px-3 py-1 rounded-full border border-sky-200">
                            Soalan ${item.id}
                        </span>
                        <div id="badge-${item.id}">
                            ${selectedOption ? (selectedOption === item.correct ? '<span class="text-green-600 text-sm font-bold">Betul! 🎉</span>' : '<span class="text-red-500 text-sm font-bold">Cuba Lagi! 💡</span>') : ''}
                        </div>
                    </div>
                    <p class="text-2xl sm:text-3xl font-extrabold text-gray-800 mb-4 text-center tracking-wide">
                        ${item.question}
                    </p>
                    <div class="grid grid-cols-2 gap-3">
                        ${optionsHTML}
                    </div>
                `;

                container.appendChild(card);
            });

            renderAnswerKey();
            updateProgress();
        }

        function selectAnswer(qId, label) {
            const question = quizData.find(q => q.id === qId);
            const isCorrect = label === question.correct;
            
            userAnswers[qId] = label;

            if (isCorrect) {
                playSound('correct');
            } else {
                playSound('wrong');
                const card = document.getElementById(`q-card-${qId}`);
                if(card) {
                    card.classList.remove('shake');
                    void card.offsetWidth; // Trigger reflow
                    card.classList.add('shake');
                }
            }

            renderQuiz();

            // Check if all answered
            if (Object.keys(userAnswers).length === quizData.length) {
                setTimeout(() => {
                    checkAllAnswers(true);
                }, 500);
            }
        }

        function updateProgress() {
            const total = quizData.length;
            const answered = Object.keys(userAnswers).length;
            
            let score = 0;
            quizData.forEach(q => {
                if (userAnswers[q.id] === q.correct) {
                    score++;
                }
            });

            document.getElementById('answered-count').innerText = answered;
            document.getElementById('score-count').innerText = score;
            document.getElementById('progress-bar').style.width = `${(answered / total) * 100}%`;
        }

        function renderAnswerKey() {
            const keyGrid = document.getElementById('answer-key-grid');
            keyGrid.innerHTML = '';

            quizData.forEach(item => {
                const isAnswered = userAnswers[item.id] !== undefined;
                const isCorrect = userAnswers[item.id] === item.correct;

                let badgeColor = "bg-white text-green-800 border-green-200";
                if (isAnswered) {
                    badgeColor = isCorrect ? "bg-green-200 text-green-900 border-green-400" : "bg-amber-100 text-amber-900 border-amber-300";
                }

                const keyItem = document.createElement('div');
                keyItem.className = `p-2 rounded-xl border ${badgeColor} text-sm flex items-center justify-between shadow-xs`;
                keyItem.innerHTML = `
                    <span>${item.id}. <strong class="text-base">${item.correct}</strong></span>
                    ${isAnswered ? (isCorrect ? '<span>✓</span>' : '<span>!</span>') : ''}
                `;
                keyGrid.appendChild(keyItem);
            });
        }

        function resetQuiz() {
            playSound('click');
            for (let member in userAnswers) delete userAnswers[member];
            renderQuiz();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function checkAllAnswers(autoTrigger = false) {
            playSound('click');
            let score = 0;
            quizData.forEach(q => {
                if (userAnswers[q.id] === q.correct) score++;
            });

            if (score === 20 && typeof confetti === 'function') {
                confetti({
                    particleCount: 120,
                    spread: 80,
                    origin: { y: 0.6 }
                });
            }

            if (!autoTrigger) {
                alert(`Tahniah! Anda telah mendapat ${score} / 20 markah! 🌟`);
            }
        }

        // Initialize quiz on window load
        window.onload = function() {
            renderQuiz();
        };

        // Firebase Config Reference
        const firebaseConfig = {
          apiKey: "AIzaSyAHnrmHqWtlfiDIhQBwUgVqymY38n7GdUc",
          authDomain: "smartkidsmate.firebaseapp.com",
          databaseURL: "https://smartkidsmate-default-rtdb.asia-southeast1.firebasedatabase.app",
          projectId: "smartkidsmate",
          storageBucket: "smartkidsmate.firebasestorage.app",
          messagingSenderId: "780128742483",
          appId: "1:780128742483:web:38c3c27d091e60b1a36aa6"
        };
    </script>
</body>
</html>
